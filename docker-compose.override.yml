      - "5051"
    volumes:
      - ${HOME}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
      - ${HOME}/.aspnet/https:/root/.aspnet/https:ro
      - ./Web/aspnetcore-localhost-C6378A2CACE83E5FE709F97D185FE61FAFFA685D.pfx:/root/.aspnet/dev-certs/https/aspnetcore-localhost-C6378A2CACE83E5FE709F97D185FE61FAFFA685D.pfx:ro